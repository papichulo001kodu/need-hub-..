name: Build NeedHub Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-apk:
    name: Build Android Release APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK (v21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Verify Build Environment
        run: |
          echo "Node:"
          node --version
          echo "NPM:"
          npm --version
          echo "Java:"
          java -version
          echo "Javac:"
          javac -version
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android Project
        run: |
          npx cap sync android
          # Ensure no conflicting png files exist in mipmap-anydpi-v26
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.png
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.png

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew clean assembleRelease --stacktrace

      - name: Verify APK & Package Identifier
        run: |
          mkdir -p build-output
          # Locate the release APK generated by Gradle
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::Release APK was not generated!"
            exit 1
          fi
          echo "Found generated APK: $APK_FILE"
          
          # Verify package ID in manifest / capacitor config
          PACKAGE_ID=$(grep -o 'applicationId "[^"]*"' android/app/build.gradle | cut -d'"' -f2)
          echo "Configured Package ID: $PACKAGE_ID"
          if [ "$PACKAGE_ID" != "com.needhub.app" ]; then
            echo "::error::Package ID mismatch! Expected com.needhub.app but found $PACKAGE_ID"
            exit 1
          fi
          
          cp "$APK_FILE" build-output/NeedHub-v1.0.0.apk
          ls -lh build-output/NeedHub-v1.0.0.apk

      - name: Upload NeedHub APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeedHub-Android-APK
          path: build-output/NeedHub-v1.0.0.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: NeedHub Android App v1.0.0
          body: |
            ## NeedHub Official Android APK (v1.0.0)
            
            - **App Name:** NeedHub
            - **Package ID:** `com.needhub.app`
            - **Release Version:** `v1.0.0`
            - **Built with:** Capacitor & Gradle Release Engine
            
            ### 📥 Direct Download
            Download the attached `NeedHub-v1.0.0.apk` below directly to your Android device to install.
          files: build-output/NeedHub-v1.0.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
